name: Procesar Quini 6 con Gemini

on:
  schedule:
    # 22:30 Hora Argentina (UTC-3) equivale a las 01:30 UTC del día siguiente.
    # Se ejecuta Miércoles (Jueves 01:30 UTC) y Domingos (Lunes 01:30 UTC).
    - cron: '30 1 * * 1,4'
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  procesar-sorteo:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Ejecutar script de procesamiento
        env:
          AI_KEY: ${{ secrets.AI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python main.py
