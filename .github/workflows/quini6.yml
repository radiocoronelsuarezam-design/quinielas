name: Procesar Quini 6 con Gemini

on:
  schedule:
    # 22:30 Hora Argentina (UTC-3) equivale a la 01:30 UTC del día siguiente.
    # Se ejecuta los Miércoles a las 22:30 AR (Jueves 01:30 UTC) y Domingos a las 22:30 AR (Lunes 01:30 UTC).
    - cron: '30 1 * * 1,4'
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la interfaz de GitHub

jobs:
  procesar-sorteo:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Ejecutar script de procesamiento
        env:
          AI_KEY: ${{ secrets.AI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python quini_6.py
